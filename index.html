<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Matt's Movie Taste Model</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0d;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif
}
main{
  max-width:760px;
  margin:auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom))
}
h1{
  font-size:30px;
  line-height:1.05;
  margin:0
}
.sub{
  color:#999;
  font-size:14px;
  margin-top:6px
}
.search{
  margin:20px 0 10px;
  position:relative
}
input{
  width:100%;
  padding:16px 48px 16px 16px;
  border-radius:15px;
  border:1px solid #3a3a40;
  background:#19191d;
  color:#fff;
  font-size:17px;
  outline:none
}
input:focus{
  border-color:#777
}
.clear{
  position:absolute;
  right:8px;
  top:8px;
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#2a2a2f;
  color:#ddd;
  font-size:22px;
  display:none
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0
}
.tabs button,.sort button{
  border:1px solid #34343a;
  border-radius:11px;
  padding:12px;
  background:#202025;
  color:#fff;
  font-weight:700;
  font-size:15px
}
.tabs button.active,.sort button.active{
  background:#fff;
  color:#111
}
.sort{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:4px;
  margin:8px 0
}
.sort button{
  white-space:nowrap;
  padding:9px 11px;
  font-size:13px
}
.status{
  color:#8f8f96;
  font-size:13px;
  margin:10px 2px
}
.card{
  background:#17171b;
  border:1px solid #2e2e34;
  border-radius:17px;
  padding:15px;
  margin:9px 0
}
.title{
  font-size:18px;
  font-weight:750;
  line-height:1.25
}
.rating{
  font-size:32px;
  font-weight:850;
  margin-top:8px;
  letter-spacing:-.5px
}
.prob{
  font-size:15px;
  margin-top:2px;
  color:#ddd
}
.meta{
  color:#9d9da4;
  font-size:13px;
  line-height:1.35;
  margin-top:7px
}
.badge{
  display:inline-block;
  margin-top:9px;
  padding:5px 8px;
  border-radius:8px;
  background:#25252a;
  color:#bdbdc4;
  font-size:12px
}
.empty{
  padding:25px 4px;
  color:#8d8d94
}
.note{
  color:#666;
  font-size:12px;
  line-height:1.4;
  margin-top:22px
}
.hidden{
  display:none
}

.probRow{
  margin-top:9px
}
.probLabel{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:11px;
  margin-bottom:4px
}
.probTrack{
  height:5px;
  background:#29292e;
  border-radius:99px;
  overflow:hidden
}
.probFill{
  height:100%;
  background:#777;
  border-radius:99px
}
.dna{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}
.dnaTag{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  background:#25252a;
  color:#bdbdc4;
  font-size:11px
}
.detail{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #2d2d32
}
.detailBtn{
  width:100%;
  border:1px solid #34343a;
  border-radius:11px;
  padding:10px;
  background:#202025;
  color:#fff;
  font-weight:700
}
.backBtn{
  width:100%;
  border:1px solid #34343a;
  border-radius:11px;
  padding:12px;
  background:#202025;
  color:#fff;
  font-weight:700;
  margin-bottom:12px
}
.dnaGrid{
  display:grid;
  gap:10px;
  margin-top:12px
}
.dnaItem{
  background:#19191d;
  border:1px solid #2e2e34;
  border-radius:12px;
  padding:10px
}
.dnaHead{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:6px
}
.dnaValue{
  color:#bbb
}
</style>
</head>

<body>
<main>

<h1>Matt's Movie Taste Model</h1>
<div class="sub">Personal movie prediction engine · spoiler-free</div>

<div class="search">
  <input
    id="q"
    type="search"
    placeholder="Search movies by title…"
    enterkeyhint="search"
    autocomplete="off"
  >
  <button id="clear" class="clear" aria-label="Clear">×</button>
</div>

<div class="tabs">
  <button id="hunt" class="active">★ 5★ Hunt</button>
  <button id="searchTab">Search Library</button>
</div>

<div id="sort" class="sort"></div>
<div id="status" class="status"></div>
<div id="list"></div>

<div class="note">
Predictions are from Matt's current taste model. 5★ probability is a separate estimate from predicted enjoyment. No spoilers or plot twists are shown.
</div>

</main>

<script>

window.MOVIE_CHUNKS = window.MOVIE_CHUNKS || [];

const files = [
  "movies-00.js",
  "movies-01.js",
  "movies-02.js",
  "movies-03.js",
  "movies-04.js",
  "movies-05.js",
  "movies-06.js",
  "movies-07.js",
  "movies-08.js",
  "movies-09.js",
  "movies-10.js",
  "movies-11.js",
  "movies-12.js"
];

const list = document.getElementById('list');
const q = document.getElementById('q');
const status = document.getElementById('status');
const huntBtn = document.getElementById('hunt');
const searchTab = document.getElementById('searchTab');
const sortBox = document.getElementById('sort');
const clearBtn = document.getElementById('clear');

let movies = [];
let currentMode = 'hunt';
let currentSort = 'p5';
let detailMovie = null;

const PROFILE_FIELDS = [
  ['character','Character'],
  ['performance','Performance'],
  ['directing','Directing'],
  ['juice','Juice'],
  ['moralDilemma','Moral Dilemma'],
  ['dialogue','Dialogue'],
  ['originality','Originality'],
  ['creativeStorytelling','Creative Storytelling'],
  ['immersion','Immersion'],
  ['emotionalConsequence','Emotional Consequence'],
  ['ideas','Ideas']
];

const PROFILE_ALIASES = {
  character:['character','Character'],
  performance:['performance','Performance','acting'],
  directing:['directing','Directing'],
  juice:['juice','Juice'],
  moralDilemma:['moralDilemma','moral_dilemma','Moral Dilemma'],
  dialogue:['dialogue','Dialogue'],
  originality:['originality','Originality'],
  creativeStorytelling:['creativeStorytelling','creative_storytelling','Creative Storytelling'],
  immersion:['immersion','Immersion'],
  emotionalConsequence:['emotionalConsequence','emotional_consequence','Emotional Consequence'],
  ideas:['ideas','Ideas']
};

const ownedByKey = new Map(
  (window.OWNED || []).map(x => [x.key, x])
);

function key(t,y){
  return String(t || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[^a-z0-9]+/g,' ')
    .trim() + '|' + y;
}

function esc(s){
  return String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function probability(v){
  if(v === null || v === undefined || v === '')
    return null;

  let n = Number(
    String(v)
      .replace('%','')
      .trim()
  );

  if(!Number.isFinite(n))
    return null;

  if(n > 1)
    n = n / 100;

  return Math.max(0,Math.min(1,n));
}

function pct(v){
  const p = probability(v);

  if(p === null)
    return '—';

  return (p * 100).toFixed(1) + '%';
}

function p45(m){
  const direct =
    m.p45 ??
    m.p4_5 ??
    m.p45plus ??
    m.p45prob;

  const d = probability(direct);

  if(d !== null)
    return d;

  const pred = Number(m.pred);

  if(!Number.isFinite(pred))
    return null;

  const p5 = probability(m.p5);

  const normalized =
    Math.max(
      0,
      Math.min(
        1,
        (pred - 3.5) / 1.5
      )
    );

  if(p5 !== null){
    return Math.max(
      p5,
      Math.min(
        0.98,
        normalized * 0.82 + p5 * 0.18
      )
    );
  }

  return normalized * 0.82;
}

function profileValue(m,field){
  for(const k of PROFILE_ALIASES[field] || [field]){
    if(m[k] !== undefined && m[k] !== null && m[k] !== '')
      return Number(m[k]);
  }

  if(m.profile){
    for(const k of PROFILE_ALIASES[field] || [field]){
      if(m.profile[k] !== undefined && m.profile[k] !== null && m.profile[k] !== '')
        return Number(m.profile[k]);
    }
  }

  return null;
}

function buildTypeTags(m){
  const tags = [];

  const rules = [
    ['character','Character-rich'],
    ['performance','Performance-driven'],
    ['directing','Director-forward'],
    ['juice','High-energy'],
    ['moralDilemma','Morally complex'],
    ['dialogue','Dialogue-heavy'],
    ['originality','Distinctive'],
    ['creativeStorytelling','Formally inventive'],
    ['immersion','Highly immersive'],
    ['emotionalConsequence','Emotionally consequential'],
    ['ideas','Idea-rich']
  ];

  for(const [field,label] of rules){
    const v = profileValue(m,field);

    if(v !== null && Number.isFinite(v) && v >= 8.5)
      tags.push(label);
  }

  return tags;
}

function probBar(label,value){
  const p = probability(value);

  if(p === null)
    return '';

  return `
    <div class="probRow">
      <div class="probLabel">
        <span>${esc(label)}</span>
        <span>${pct(p)}</span>
      </div>
      <div class="probTrack">
        <div class="probFill" style="width:${Math.round(p*100)}%"></div>
      </div>
    </div>
  `;
}

function movieCard(m,index){
  const pred = Number(m.pred);
  const p5 = probability(m.p5);
  const p45v = p45(m);
  const tags = buildTypeTags(m);

  return `
    <div class="card">
      <div class="title">
        ${esc(m.title)}
        ${m.year ? `<span class="meta">(${esc(m.year)})</span>` : ''}
      </div>

      ${
        Number.isFinite(pred)
          ? `<div class="rating">${pred.toFixed(1)}★</div>`
          : `<div class="rating">—</div>`
      }

      ${probBar('5★ probability',p5)}
      ${probBar('4½★+ probability',p45v)}

      <div class="meta">
        ${esc(m.genre || '')}
        ${m.director ? ' · ' + esc(m.director) : ''}
      </div>

      ${
        tags.length
          ? `<div class="dna">${tags.map(x=>`<span class="dnaTag">${esc(x)}</span>`).join('')}</div>`
          : ''
      }

      <div class="detail">
        <button class="detailBtn" onclick="showDetail(${index})">
          View Film DNA
        </button>
      </div>
    </div>
  `;
}

function detailView(m){
  const p5 = probability(m.p5);
  const p45v = p45(m);

  const fields = PROFILE_FIELDS.map(([field,label]) => {
    const v = profileValue(m,field);

    if(v === null || !Number.isFinite(v))
      return '';

    return `
      <div class="dnaItem">
        <div class="dnaHead">
          <span>${esc(label)}</span>
          <span class="dnaValue">${v.toFixed(1)}/10</span>
        </div>
        <div class="probTrack">
          <div class="probFill" style="width:${Math.max(0,Math.min(100,v*10))}%"></div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <button class="backBtn" onclick="closeDetail()">← Back</button>

    <div class="card">
      <div class="title">
        ${esc(m.title)}
        ${m.year ? `<span class="meta">(${esc(m.year)})</span>` : ''}
      </div>

      ${
        Number.isFinite(Number(m.pred))
          ? `<div class="rating">${Number(m.pred).toFixed(1)}★</div>`
          : ''
      }

      <div class="meta">
        ${m.genre ? esc(m.genre) : ''}
        ${m.director ? ' · ' + esc(m.director) : ''}
      </div>

      ${
        m.stars
          ? `<div class="meta">${esc(m.stars)}</div>`
          : ''
      }

      ${
        m.runtime
          ? `<div class="meta">${esc(m.runtime)}</div>`
          : ''
      }

      ${probBar('5★ probability',p5)}
      ${probBar('4½★+ probability',p45v)}

      ${
        m.description
          ? `<div class="detail"><div class="meta">${esc(m.description)}</div></div>`
          : ''
      }

      <div class="detail">
        <div class="title" style="font-size:16px">Film DNA</div>
        <div class="dnaGrid">${fields || '<div class="empty">Film DNA not available for this film.</div>'}</div>
      </div>
    </div>
  `;
}

window.showDetail = function(index){
  detailMovie = movies[index] || null;

  if(!detailMovie)
    return;

  list.innerHTML = detailView(detailMovie);
  status.textContent = '';
  sortBox.innerHTML = '';
};

window.closeDetail = function(){
  detailMovie = null;
  render();
};

function renderSort(){
  if(currentMode !== 'hunt'){
    sortBox.innerHTML = '';
    return;
  }

  sortBox.innerHTML = `
    <button class="${currentSort==='p5'?'active':''}" onclick="setSort('p5')">5★ Probability</button>
    <button class="${currentSort==='p45'?'active':''}" onclick="setSort('p45')">4½★+ Probability</button>
    <button class="${currentSort==='pred'?'active':''}" onclick="setSort('pred')">Predicted Rating</button>
  `;
}

window.setSort = function(sort){
  currentSort = sort;
  render();
};

function hunt(){
  currentMode = 'hunt';
  detailMovie = null;

  huntBtn.classList.add('active');
  searchTab.classList.remove('active');

  q.value = '';
  clearBtn.style.display = 'none';

  render();
}

function searchMode(){
  currentMode = 'search';
  detailMovie = null;

  searchTab.classList.add('active');
  huntBtn.classList.remove('active');

  render();
  q.focus();
}

function render(){
  if(detailMovie){
    list.innerHTML = detailView(detailMovie);
    status.textContent = '';
    sortBox.innerHTML = '';
    return;
  }

  renderSort();

  if(currentMode === 'search'){
    renderSearch();
    return;
  }

  const hunt = movies.filter(m => {
    const o = ownedByKey.get(key(m.title,m.year));

    return (
      o &&
      Number(o.rated) === 0 &&
      m.pred != null
    );
  });

  hunt.sort((a,b) => {
    if(currentSort === 'p45')
      return (p45(b) ?? -1) - (p45(a) ?? -1);

    if(currentSort === 'pred')
      return Number(b.pred ?? -999) - Number(a.pred ?? -999);

    return (probability(b.p5) ?? -1) - (probability(a.p5) ?? -1);
  });

  const top = hunt.slice(0,5);

  status.textContent =
    `${hunt.length} owned · unwatched · showing top ${top.length}`;

  if(!top.length){
    list.innerHTML =
      '<div class="empty">No owned unwatched films with predictions found.</div>';
    return;
  }

  list.innerHTML = top.map(m => {
    const index = movies.indexOf(m);
    return movieCard(m,index);
  }).join('');
}

function renderSearch(){
  const s = q.value.trim().toLowerCase();

  clearBtn.style.display = s ? 'block' : 'none';

  if(!s){
    status.textContent = '';
    list.innerHTML =
      '<div class="empty">Search by film title.</div>';
    return;
  }

  const hits = movies
    .filter(m =>
      String(m.title || '')
        .toLowerCase()
        .includes(s)
    )
    .slice(0,40);

  status.textContent =
    hits.length
      ? `${hits.length} result${hits.length===1?'':'s'}`
      : 'No results';

  list.innerHTML = hits.length
    ? hits.map(m => movieCard(m,movies.indexOf(m))).join('')
    : '<div class="empty">No matching movie in the current library.</div>';
}

huntBtn.addEventListener('click',hunt);
searchTab.addEventListener('click',searchMode);

q.addEventListener('input',() => {
  if(currentMode === 'search')
    renderSearch();
});

q.addEventListener('keydown',e => {
  if(e.key === 'Enter'){
    e.preventDefault();

    if(currentMode !== 'search')
      searchMode();
    else
      renderSearch();
  }
});

clearBtn.addEventListener('click',() => {
  q.value = '';
  renderSearch();
  q.focus();
});

async function loadScript(src){
  return new Promise((resolve,reject) => {
    const s = document.createElement('script');

    s.src = src;
    s.onload = resolve;
    s.onerror = () =>
      reject(new Error('Could not load ' + src));

    document.head.appendChild(s);
  });
}

async function boot(){

  status.textContent = 'Loading movie library…';

  try{

    for(const file of files){
      await loadScript(file);
    }

    movies = (window.MOVIE_CHUNKS || [])
      .flat()
      .filter(Boolean);

    status.textContent =
      `${movies.length.toLocaleString()} movies loaded`;

    render();

  }catch(err){

    console.error(err);

    status.textContent = 'Error loading movie library.';

    list.innerHTML = `
      <div class="empty">
        Could not load the movie data files.
        Make sure movies-00.js through movies-12.js
        are in the same folder as index.html.
      </div>
    `;
  }
}

boot();

</script>
</body>
</html>
