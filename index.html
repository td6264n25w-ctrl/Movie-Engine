<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><title>Matt’s Movie Taste Model</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111118,#08080b 55%);min-height:100vh}button,input{font:inherit}.wrap{max-width:900px;margin:auto;padding:18px 14px 90px}.hero{padding:12px 4px 18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a7a7b0}.title{font-size:32px;font-weight:800;margin:5px 0}.sub{color:#a7a7b0;font-size:14px}.tabs{position:sticky;top:0;z-index:4;background:rgba(11,11,15,.9);backdrop-filter:blur(14px);display:flex;gap:8px;padding:8px 0 12px}.tab{flex:1;border:1px solid #2a2a34;background:#17171f;color:#ddd;border-radius:13px;padding:12px;font-weight:700}.tab.active{background:#f5f5f7;color:#111}.panel{display:none}.panel.active{display:block}.searchbox{width:100%;background:#15151d;border:1px solid #30303a;color:#fff;border-radius:14px;padding:14px 16px;outline:none}.searchbox:focus{border-color:#888}.toolbar{display:flex;gap:8px;margin:10px 0;overflow:auto}.chip{white-space:nowrap;border:1px solid #30303a;background:#15151d;color:#bbb;border-radius:999px;padding:8px 11px}.chip.active{color:#111;background:#fff}.card{border:1px solid #292933;background:rgba(23,23,31,.92);border-radius:18px;padding:15px;margin:10px 0;cursor:pointer}.card:active{transform:scale(.995)}.row{display:flex;justify-content:space-between;gap:12px}.movie{font-weight:750;font-size:17px}.meta{font-size:13px;color:#9999a5;margin-top:4px}.pred{font-size:22px;font-weight:800;white-space:nowrap}.p5{font-size:12px;color:#bdbdc8;margin-top:2px;text-align:right}.badge{display:inline-block;font-size:11px;color:#aaa;background:#20202a;border-radius:7px;padding:3px 6px;margin:7px 5px 0 0}.empty{padding:35px 10px;text-align:center;color:#92929c}.detail{position:fixed;inset:0;z-index:10;background:#0b0b0f;overflow:auto;padding:18px 16px 60px}.detailbox{max-width:760px;margin:auto}.close{border:0;background:#22222b;color:#fff;border-radius:12px;padding:10px 14px}.big{font-size:38px;font-weight:850;margin:24px 0 4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#17171f;border:1px solid #2b2b35;border-radius:16px;padding:14px}.stat b{display:block;font-size:25px}.label{font-size:12px;color:#999}.desc{color:#d0d0d8;line-height:1.55}.note{font-size:12px;color:#777;margin-top:18px}.spinner{padding:18px;text-align:center;color:#999}@media(min-width:700px){.card{padding:18px}.big{font-size:48px}}
</style></head><body>
<div class="wrap"><div class="hero"><div class="eyebrow">MATT’S MOVIE TASTE MODEL</div><div class="title">5★ Hunt</div><div class="sub" id="status">Loading your movie universe…</div></div><div class="tabs"><button class="tab active" data-tab="hunt">5★ Hunt</button><button class="tab" data-tab="search">Search</button></div><section id="hunt" class="panel active"><div class="toolbar"><button class="chip active" data-sort="p5">5★ probability</button><button class="chip" data-sort="pred">Predicted rating</button><button class="chip" data-sort="high">High upside</button></div><div id="huntList" class="spinner">Loading…</div></section><section id="search" class="panel"><input id="q" class="searchbox" placeholder="Search movies…" autocomplete="off"/><div class="sub" style="margin:10px 2px" id="searchStatus"></div><div id="searchList"></div></section></div><div id="detail" class="detail" hidden><div class="detailbox"><button class="close" id="close">← Back</button><div id="detailBody"></div></div></div>
<script src="owned.js"></script>
<script>
const ownedByKey=new Map((window.OWNED||[]).map(x=>[x.key,x]));let movies=[];let movieByKey=new Map();let hunt=[];let sortMode='p5';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(t,y){return String(t||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim()+'|'+y}
function stars(s){return String(s||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean).slice(0,4).join(', ')}
function card(m,owned){return `<div class="card" data-id="${esc(m.id)}"><div class="row"><div><div class="movie">${esc(m.title)}</div><div class="meta">${esc(m.year)} · ${esc(m.genre||'')}</div></div><div><div class="pred">${Number(m.pred||0).toFixed(1)}★</div><div class="p5">${(Number(m.p5||0)*100).toFixed(1)}% 5★</div></div></div>${owned?'<span class="badge">OWNED · UNWATCHED</span>':''}</div>`}
function renderHunt(){let a=[...hunt];if(sortMode==='p5')a.sort((x,y)=>y.p5-x.p5);else if(sortMode==='pred')a.sort((x,y)=>y.pred-x.pred);else a.sort((x,y)=>(y.p5*(5-y.pred))-(x.p5*(5-x.pred)));document.getElementById('huntList').innerHTML=a.map(x=>card(x,true)).join('');document.querySelectorAll('#huntList .card').forEach(el=>el.onclick=()=>show(el.dataset.id))}
function show(id){let m=movieByKey.get(id);if(!m)return;let o=ownedByKey.get(key(m.title,m.year));document.getElementById('detailBody').innerHTML=`<div class="big">${esc(m.title)}</div><div class="meta">${esc(m.year)} · ${esc(m.genre||'')}</div><div class="stats"><div class="stat"><span class="label">PREDICTED MATT RATING</span><b>${Number(m.pred||0).toFixed(1)}★</b></div><div class="stat"><span class="label">5★ PROBABILITY</span><b>${(Number(m.p5||0)*100).toFixed(1)}%</b></div></div><p><b>Director:</b> ${esc(m.director||'Unknown')}</p><p><b>Cast:</b> ${esc(stars(m.stars))}</p><p><b>Runtime:</b> ${esc(m.runtime||'Unknown')}</p><p><b>IMDb:</b> ${Number(m.imdb||0).toFixed(1)}</p><p class="desc">${esc(m.description||'No synopsis available.')}</p>${o?'<span class="badge">OWNED · UNWATCHED</span>':''}<div class="note">Predictions are from the current Matt’s Movie Taste Model. Spoiler-free metadata only.</div>`;document.getElementById('detail').hidden=false;document.body.style.overflow='hidden'}
document.getElementById('close').onclick=()=>{document.getElementById('detail').hidden=true;document.body.style.overflow=''};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');sortMode=b.dataset.sort;renderHunt()});
let timer;document.getElementById('q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),80)});
function search(q){q=q.trim().toLowerCase();let box=document.getElementById('searchList');if(!q){box.innerHTML='';document.getElementById('searchStatus').textContent='Search the full IMDb metadata library.';return}let terms=q.split(/\s+/);let hits=[];for(const m of movies){let t=(m.title+' '+m.year+' '+m.genre+' '+m.director+' '+m.stars).toLowerCase();if(terms.every(x=>t.includes(x)))hits.push(m);if(hits.length>=60)break}document.getElementById('searchStatus').textContent=`${hits.length}${hits.length===60?'+':''} results`;box.innerHTML=hits.map(m=>card(m,false)).join('');box.querySelectorAll('.card').forEach(el=>el.onclick=()=>show(el.dataset.id))}
async function load(){
const files=[
"movies-00.js",
"movies-01.js",
"movies-02.js",
"movies-03.js",
"movies-04.js",
"movies-05.js",
"movies-06.js",
"movies-07.js",
"movies-08.js",
"movies-09.js",
"movies-10.js",
"movies-11.js"
];

for(let i=0;i<files.length;i++){
await new Promise((resolve,reject)=>{
let s=document.createElement('script');
s.src=files[i];
s.onload=resolve;
s.onerror=reject;
document.head.appendChild(s);
});
document.getElementById('status').textContent=`Loading movie library… ${Math.round((i+1)/files.length*100)}%`;
}

movies=(window.MOVIE_CHUNKS||[]).flat();
movieByKey=new Map(movies.map(m=>[m.id,m]));

hunt=movies.filter(m=>{
let o=ownedByKey.get(key(m.title,m.year));
return o&&Number(o.rated)===0&&m.pred!=null;
});

document.getElementById('status').textContent=`${hunt.length} owned, unwatched movies with predictions · ${movies.length.toLocaleString()} movies searchable`;
renderHunt();
}

load().catch(e=>{
document.getElementById('status').textContent='Library failed to load.';
document.getElementById('huntList').innerHTML='<div class="empty">The movie data could not be loaded. Please refresh and try again.</div>';
console.error(e);
});
