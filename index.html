<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Matt’s Movie Taste Model</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  background:#0b0b0f;
  color:#f5f5f7
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#111118,#08080b 55%);
  min-height:100vh
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{
  max-width:900px;
  margin:auto;
  padding:18px 14px 90px
}
.hero{padding:12px 4px 18px}
.eyebrow{
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#a7a7b0
}
.title{
  font-size:32px;
  font-weight:800;
  margin:5px 0
}
.sub{
  color:#a7a7b0;
  font-size:14px
}
.tabs{
  position:sticky;
  top:0;
  z-index:4;
  background:rgba(11,11,15,.9);
  backdrop-filter:blur(14px);
  display:flex;
  gap:8px;
  padding:8px 0 12px;
  overflow-x:auto
}
.tab{
  flex:1;
  min-width:90px;
  border:1px solid #2a2a34;
  background:#17171f;
  color:#ddd;
  border-radius:13px;
  padding:12px 10px;
  font-weight:700
}
.tab.active{
  background:#f5f5f7;
  color:#111
}
.panel{display:none}
.panel.active{display:block}
.searchbox{
  width:100%;
  background:#15151d;
  border:1px solid #30303a;
  color:#fff;
  border-radius:14px;
  padding:14px 16px;
  outline:none
}
.searchbox:focus{border-color:#888}
.toolbar{
  display:flex;
  gap:8px;
  margin:10px 0;
  overflow:auto
}
.chip{
  white-space:nowrap;
  border:1px solid #30303a;
  background:#15151d;
  color:#bbb;
  border-radius:999px;
  padding:8px 11px
}
.chip.active{
  color:#111;
  background:#fff
}
.selectbox{
  width:100%;
  border:1px solid #30303a;
  background:#15151d;
  color:#fff;
  border-radius:14px;
  padding:14px 16px;
  outline:none;
  margin:10px 0
}
.genreIntro{
  margin:12px 2px 14px
}
.genreTitle{
  font-size:22px;
  font-weight:800
}
.genreSub{
  color:#9999a5;
  font-size:13px;
  margin-top:4px
}
.card{
  border:1px solid #292933;
  background:rgba(23,23,31,.92);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  cursor:pointer
}
.card:active{transform:scale(.995)}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px
}
.movie{
  font-weight:750;
  font-size:17px
}
.meta{
  font-size:13px;
  color:#9999a5;
  margin-top:4px
}
.pred{
  font-size:22px;
  font-weight:800;
  white-space:nowrap
}
.probrow{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:3px;
  flex-wrap:wrap
}
.p5,
.p45{
  font-size:12px;
  color:#bdbdc8;
  white-space:nowrap
}
.p45{color:#d8d8e0}
.badge{
  display:inline-block;
  font-size:11px;
  color:#aaa;
  background:#20202a;
  border-radius:7px;
  padding:3px 6px;
  margin:7px 5px 0 0
}
.profileMini{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px
}
.miniScore{
  font-size:10px;
  color:#9999a5;
  border:1px solid #30303a;
  border-radius:999px;
  padding:4px 7px
}
.empty{
  padding:35px 10px;
  text-align:center;
  color:#92929c
}
.detail{
  position:fixed;
  inset:0;
  z-index:10;
  background:#0b0b0f;
  overflow:auto;
  padding:18px 16px 60px
}
.detailbox{
  max-width:760px;
  margin:auto
}
.close{
  border:0;
  background:#22222b;
  color:#fff;
  border-radius:12px;
  padding:10px 14px
}
.big{
  font-size:38px;
  font-weight:850;
  margin:24px 0 4px
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:18px 0
}
.stat{
  background:#17171f;
  border:1px solid #2b2b35;
  border-radius:16px;
  padding:14px
}
.stat b{
  display:block;
  font-size:25px;
  margin-top:3px
}
.statSmall{
  font-size:13px;
  color:#aaa;
  margin-top:4px
}
.label{
  font-size:12px;
  color:#999
}
.sectionTitle{
  font-size:18px;
  font-weight:800;
  margin:28px 0 10px
}
.profileGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.profileItem{
  background:#17171f;
  border:1px solid #2b2b35;
  border-radius:14px;
  padding:12px
}
.profileName{
  font-size:12px;
  color:#9999a5;
  margin-bottom:5px
}
.profileScore{
  font-size:22px;
  font-weight:800
}
.profileBar{
  height:4px;
  border-radius:99px;
  background:#2b2b35;
  margin-top:8px;
  overflow:hidden
}
.profileFill{
  height:100%;
  background:#f5f5f7;
  border-radius:99px
}
.typeBox{
  border:1px solid #2b2b35;
  background:#17171f;
  border-radius:16px;
  padding:14px;
  color:#d0d0d8;
  line-height:1.5
}
.typeTags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}
.typeTag{
  font-size:11px;
  background:#22222b;
  color:#c7c7cf;
  border-radius:999px;
  padding:6px 9px
}
.note{
  font-size:12px;
  color:#777;
  margin-top:18px;
  line-height:1.5
}
.spinner{
  padding:18px;
  text-align:center;
  color:#999
}
.huntRank{
  display:inline-flex;
  width:27px;
  height:27px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#22222b;
  color:#aaa;
  font-size:12px;
  font-weight:800;
  margin-right:8px
}
.genreResultHeader{
  display:flex;
  align-items:center;
  margin-bottom:8px
}
@media(min-width:700px){
  .card{padding:18px}
  .big{font-size:48px}
  .profileGrid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <div class="eyebrow">MATT’S MOVIE TASTE MODEL</div>
    <div class="title">5★ Hunt</div>
    <div class="sub" id="status">Loading your movie universe…</div>
  </div>

  <div class="tabs">

    <button class="tab active" data-tab="hunt">
      5★ Hunt
    </button>

    <button class="tab" data-tab="genres">
      Genre Hunt
    </button>

    <button class="tab" data-tab="search">
      Search
    </button>

  </div>

  <section id="hunt" class="panel active">

    <div class="toolbar">

      <button class="chip active" data-sort="p5">
        5★ probability
      </button>

      <button class="chip" data-sort="p45">
        4½★ probability
      </button>

      <button class="chip" data-sort="pred">
        Predicted rating
      </button>

      <button class="chip" data-sort="high">
        High upside
      </button>

    </div>

    <div id="huntList" class="spinner">
      Loading…
    </div>

  </section>

  <section id="genres" class="panel">

    <select id="genreSelect" class="selectbox">
      <option value="">Choose a genre…</option>
    </select>

    <div id="genreIntro" class="genreIntro"></div>

    <div id="genreList" class="spinner">
      Choose a genre to begin.
    </div>

  </section>

  <section id="search" class="panel">

    <input
      id="q"
      class="searchbox"
      placeholder="Search movies by title…"
      autocomplete="off"
    >

    <div
      class="sub"
      style="margin:10px 2px"
      id="searchStatus"
    ></div>

    <div id="searchList"></div>

  </section>

</div>

<div id="detail" class="detail" hidden>

  <div class="detailbox">

    <button class="close" id="close">
      ← Back
    </button>

    <div id="detailBody"></div>

  </div>

</div>

<script src="owned.js"></script>

<script>

const ownedByKey = new Map(
  (window.OWNED || []).map(x => [x.key, x])
);

let movies = [];
let movieByKey = new Map();
let hunt = [];
let sortMode = 'p5';
let selectedGenre = '';

const esc = s =>
  String(s ?? '').replace(
    /[&<>"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );

function key(t,y){

  return String(t || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[^a-z0-9]+/g,' ')
    .trim() + '|' + y;

}

function stars(s){

  return String(s || '')
    .split(/\n|,/)
    .map(x => x.trim())
    .filter(Boolean)
    .slice(0,4)
    .join(', ');

}

function probability(v){

  if(v === null || v === undefined || v === '')
    return null;

  let n = Number(
    String(v)
      .replace('%','')
      .trim()
  );

  if(!Number.isFinite(n))
    return null;

  if(n > 1)
    n = n / 100;

  return Math.max(0,Math.min(1,n));

}

function pct(v){

  const p = probability(v);

  if(p === null)
    return '—';

  return (p * 100).toFixed(1) + '%';

}

function p45(m){

  const direct =
    m.p45 ??
    m.p4_5 ??
    m.p45plus ??
    m.p45prob;

  const d = probability(direct);

  if(d !== null)
    return d;

  const pred = Number(m.pred);

  if(!Number.isFinite(pred))
    return null;

  const p5 = probability(m.p5);

  const normalized =
    Math.max(
      0,
      Math.min(
        1,
        (pred - 3.5) / 1.5
      )
    );

  if(p5 !== null){

    return Math.max(
      p5,
      Math.min(
        0.98,
        normalized * 0.82 + p5 * 0.18
      )
    );

  }

  return normalized * 0.82;

}

const PROFILE_FIELDS = [

  ['character','Character'],
  ['performance','Performance'],
  ['directing','Directing'],
  ['juice','Juice'],
  ['moralDilemma','Moral Dilemma'],
  ['dialogue','Dialogue'],
  ['originality','Originality'],
  ['creativeStorytelling','Creative Storytelling'],
  ['immersion','Immersion'],
  ['emotionalConsequence','Emotional Consequence'],
  ['ideas','Ideas']

];

function profileValue(m,field){

  const aliases = {

    character:[
      'character',
      'characterScore'
    ],

    performance:[
      'performance',
      'performanceScore'
    ],

    directing:[
      'directing',
      'direction',
      'directingScore',
      'directionScore'
    ],

    juice:[
      'juice',
      'juiceScore'
    ],

    moralDilemma:[
      'moralDilemma',
      'moral_dilemma',
      'moralDilemmaScore'
    ],

    dialogue:[
      'dialogue',
      'dialogueScore'
    ],

    originality:[
      'originality',
      'originalityScore'
    ],

    creativeStorytelling:[
      'creativeStorytelling',
      'creative_storytelling',
      'creativeStorytellingScore'
    ],

    immersion:[
      'immersion',
      'immersionScore'
    ],

    emotionalConsequence:[
      'emotionalConsequence',
      'emotional_consequence',
      'emotionalConsequenceScore'
    ],

    ideas:[
      'ideas',
      'ideasScore'
    ]

  };

  const names = aliases[field] || [field];

  for(const n of names){

    if(
      m[n] !== undefined &&
      m[n] !== null &&
      m[n] !== ''
    ){

      const v = Number(m[n]);

      if(Number.isFinite(v))
        return Math.max(0,Math.min(10,v));

    }

  }

  if(
    m.profile &&
    m.profile[field] !== undefined
  ){

    const v = Number(m.profile[field]);

    if(Number.isFinite(v))
      return Math.max(0,Math.min(10,v));

  }

  return null;

}

function buildTypeTags(m){

  const tags = [];

  const p = field =>
    profileValue(m,field);

  if((p('character') ?? 0) >= 8.5)
    tags.push('Character-rich');

  if((p('performance') ?? 0) >= 8.5)
    tags.push('Performance-driven');

  if((p('directing') ?? 0) >= 8.5)
    tags.push('Director-forward');

  if((p('juice') ?? 0) >= 8.5)
    tags.push('High-energy');

  if((p('moralDilemma') ?? 0) >= 8.5)
    tags.push('Morally complex');

  if((p('dialogue') ?? 0) >= 8.5)
    tags.push('Dialogue-heavy');

  if((p('originality') ?? 0) >= 8.5)
    tags.push('Distinctive');

  if((p('creativeStorytelling') ?? 0) >= 8.5)
    tags.push('Formally inventive');

  if((p('immersion') ?? 0) >= 8.5)
    tags.push('Highly immersive');

  if((p('emotionalConsequence') ?? 0) >= 8.5)
    tags.push('Emotionally consequential');

  if((p('ideas') ?? 0) >= 8.5)
    tags.push('Idea-rich');

  return tags.slice(0,6);

}

function profileDescription(m){

  const tags = buildTypeTags(m);

  if(!tags.length)
    return 'Spoiler-free film profile information is available when the Film DNA scores are present in the movie data.';

  return tags.join(' · ');

}

function card(m,owned,rank){

  const p5 = probability(m.p5);
  const p45v = p45(m);

  return `

    <div class="card" data-id="${esc(m.id)}">

      <div class="row">

        <div>

          ${
            rank
            ? `
              <div class="genreResultHeader">
                <span class="huntRank">${rank}</span>
                <div class="movie">
                  ${esc(m.title)}
                </div>
              </div>
            `
            : `
              <div class="movie">
                ${esc(m.title)}
              </div>
            `
          }

          <div class="meta">
            ${esc(m.year)} · ${esc(m.genre || '')}
          </div>

        </div>

        <div>

          <div class="pred">
            ${Number(m.pred || 0).toFixed(1)}★
          </div>

          <div class="probrow">

            <div class="p5">
              ${pct(p5)} 5★
            </div>

            <div class="p45">
              ${pct(p45v)} 4½★+
            </div>

          </div>

        </div>

      </div>

      ${
        owned
        ? '<span class="badge">OWNED · UNWATCHED</span>'
        : ''
      }

      ${
        buildTypeTags(m).length
        ? `
          <div class="profileMini">
            ${
              buildTypeTags(m)
                .slice(0,4)
                .map(x =>
                  `<span class="miniScore">${esc(x)}</span>`
                )
                .join('')
            }
          </div>
        `
        : ''
      }

    </div>

  `;

}

function renderHunt(){

  let a = [...hunt];

  if(sortMode === 'p5'){

    a.sort(
      (x,y) =>
        (probability(y.p5) ?? 0) -
        (probability(x.p5) ?? 0)
    );

  }
  else if(sortMode === 'p45'){

    a.sort(
      (x,y) =>
        (p45(y) ?? 0) -
        (p45(x) ?? 0)
    );

  }
  else if(sortMode === 'pred'){

    a.sort(
      (x,y) =>
        Number(y.pred || 0) -
        Number(x.pred || 0)
    );

  }
  else{

    a.sort(
      (x,y) =>
        (
          (probability(y.p5) ?? 0) *
          Math.max(0,5-Number(y.pred || 0))
        ) -
        (
          (probability(x.p5) ?? 0) *
          Math.max(0,5-Number(x.pred || 0))
        )
    );

  }

  document.getElementById('huntList').innerHTML =
    a.map(x => card(x,true)).join('');

  document
    .querySelectorAll('#huntList .card')
    .forEach(el => {

      el.onclick = () =>
        show(el.dataset.id);

    });

}

function normalizeGenres(m){

  const raw =
    m.genre ??
    m.genres ??
    '';

  if(Array.isArray(raw))
    return raw
      .map(x => String(x).trim())
      .filter(Boolean);

  return String(raw)
    .split(/[|,;/]/)
    .map(x => x.trim())
    .filter(Boolean);

}

function populateGenres(){

  const set = new Set();

  hunt.forEach(m => {

    normalizeGenres(m)
      .forEach(g => set.add(g));

  });

  const genres = [...set]
    .sort((a,b) =>
      a.localeCompare(b)
    );

  const select =
    document.getElementById('genreSelect');

  select.innerHTML =
    '<option value="">Choose a genre…</option>' +

    genres
      .map(g =>
        `<option value="${esc(g)}">${esc(g)}</option>`
      )
      .join('');

}

document
  .getElementById('genreSelect')
  .addEventListener('change',e => {

    selectedGenre = e.target.value;

    renderGenreHunt();

  });

function renderGenreHunt(){

  const list =
    document.getElementById('genreList');

  const intro =
    document.getElementById('genreIntro');

  if(!selectedGenre){

    intro.innerHTML = '';

    list.innerHTML =
      '<div class="empty">Choose a genre to see the five movies with the highest predicted 5★ probability.</div>';

    return;

  }

  const genreLower =
    selectedGenre.toLowerCase();

  let candidates =
    hunt.filter(m =>

      normalizeGenres(m)
        .some(g =>
          g.toLowerCase() === genreLower
        )

    );

  candidates.sort(
    (a,b) =>
      (probability(b.p5) ?? 0) -
      (probability(a.p5) ?? 0)
  );

  candidates =
    candidates.slice(0,5);

  intro.innerHTML = `

    <div class="genreTitle">
      ${esc(selectedGenre)}
    </div>

    <div class="genreSub">
      Five owned, unwatched films with the highest predicted 5★ probability.
    </div>

  `;

  if(!candidates.length){

    list.innerHTML =
      '<div class="empty">No matching films found.</div>';

    return;

  }

  list.innerHTML =
    candidates
      .map((m,i) =>
        card(m,true,i+1)
      )
      .join('');

  list
    .querySelectorAll('.card')
    .forEach(el => {

      el.onclick = () =>
        show(el.dataset.id);

    });

}

function show(id){

  let m = movieByKey.get(id);

  if(!m) return;

  let o = ownedByKey.get(
    key(m.title,m.year)
  );

  const p5 = probability(m.p5);
  const p45v = p45(m);

  const profileHTML =
    PROFILE_FIELDS
      .map(([field,label]) => {

        const value =
          profileValue(m,field);

        return `

          <div class="profileItem">

            <div class="profileName">
              ${esc(label)}
            </div>

            <div class="profileScore">
              ${
                value === null
                ? '—'
                : value.toFixed(1)
              }
            </div>

            ${
              value === null
              ? ''
              : `
                <div class="profileBar">
                  <div
                    class="profileFill"
                    style="width:${value * 10}%"
                  ></div>
                </div>
              `
            }

          </div>

        `;

      })
      .join('');

  const tags =
    buildTypeTags(m);

  document.getElementById('detailBody').innerHTML = `

    <div class="big">
      ${esc(m.title)}
    </div>

    <div class="meta">
      ${esc(m.year)} · ${esc(m.genre || '')}
    </div>

    <div class="stats">

      <div class="stat">

        <span class="label">
          PREDICTED MATT RATING
        </span>

        <b>
          ${Number(m.pred || 0).toFixed(1)}★
        </b>

      </div>

      <div class="stat">

        <span class="label">
          5★ PROBABILITY
        </span>

        <b>
          ${pct(p5)}
        </b>

      </div>

      <div class="stat">

        <span class="label">
          4½★+ PROBABILITY
        </span>

        <b>
          ${pct(p45v)}
        </b>

        <div class="statSmall">
          Probability of a 4½★ or better reaction.
        </div>

      </div>

      <div class="stat">

        <span class="label">
          IMDb
        </span>

        <b>
          ${
            Number(m.imdb || 0)
              ? Number(m.imdb).toFixed(1)
              : '—'
          }
        </b>

      </div>

    </div>

    <div class="sectionTitle">
      Film DNA
    </div>

    <div class="profileGrid">
      ${profileHTML}
    </div>

    <div class="sectionTitle">
      What kind of film is this?
    </div>

    <div class="typeBox">

      ${esc(profileDescription(m))}

      ${
        tags.length
        ? `
          <div class="typeTags">

            ${
              tags
                .map(x =>
                  `<span class="typeTag">${esc(x)}</span>`
                )
                .join('')
            }

          </div>
        `
        : ''
      }

    </div>

    <div class="sectionTitle">
      Film Information
    </div>

    <p>
      <b>Director:</b>
      ${esc(m.director || 'Unknown')}
    </p>

    <p>
      <b>Cast:</b>
      ${esc(stars(m.stars))}
    </p>

    <p>
      <b>Runtime:</b>
      ${esc(m.runtime || 'Unknown')}
    </p>

    ${
      o
      ? '<span class="badge">OWNED · UNWATCHED</span>'
      : ''
    }

    <div class="note">

      Film DNA describes characteristics of the film
      without revealing narrative events.

      No plot developments, endings, twists,
      deaths, betrayals, or other narrative spoilers
      are used in this profile.

    </div>

  `;

  document.getElementById('detail').hidden = false;

  document.body.style.overflow = 'hidden';

}

document.getElementById('close').onclick = () => {

  document.getElementById('detail').hidden = true;

  document.body.style.overflow = '';

};

document.querySelectorAll('.tab').forEach(b => {

  b.onclick = () => {

    document
      .querySelectorAll('.tab')
      .forEach(x =>
        x.classList.remove('active')
      );

    document
      .querySelectorAll('.panel')
      .forEach(x =>
        x.classList.remove('active')
      );

    b.classList.add('active');

    document
      .getElementById(b.dataset.tab)
      .classList.add('active');

  };

});

document.querySelectorAll('.chip').forEach(b => {

  b.onclick = () => {

    document
      .querySelectorAll('.chip')
      .forEach(x =>
        x.classList.remove('active')
      );

    b.classList.add('active');

    sortMode = b.dataset.sort;

    renderHunt();

  };

});

let timer;

document.getElementById('q')
  .addEventListener(
    'input',
    e => {

      clearTimeout(timer);

      timer = setTimeout(
        () => search(e.target.value),
        80
      );

    }
  );

function search(q){

  q = q.trim().toLowerCase();

  let box =
    document.getElementById('searchList');

  if(!q){

    box.innerHTML = '';

    document
      .getElementById('searchStatus')
      .textContent =
        'Search the movie library by title.';

    return;

  }

  let terms =
    q.split(/\s+/);

  let hits = [];

  for(const m of movies){

    const title =
      String(m.title || '')
        .toLowerCase();

    if(
      terms.every(
        x => title.includes(x)
      )
    )
      hits.push(m);

    if(hits.length >= 60)
      break;

  }

  document
    .getElementById('searchStatus')
    .textContent =
      `${hits.length}${hits.length === 60 ? '+' : ''} results`;

  box.innerHTML =
    hits
      .map(m => card(m,false))
      .join('');

  box
    .querySelectorAll('.card')
    .forEach(el => {

      el.onclick = () =>
        show(el.dataset.id);

    });

}

async function load(){

  const files = [

    "movies-00.js",
    "movies-01.js",
    "movies-02.js",
    "movies-03.js",
    "movies-04.js",
    "movies-05.js",
    "movies-06.js",
    "movies-07.js",
    "movies-08.js",
    "movies-09.js",
    "movies-10.js",
    "movies-11.js"

  ];

  document
    .getElementById('status')
    .textContent =
      'Starting movie library… 0%';

  for(
    let i = 0;
    i < files.length;
    i++
  ){

    const name = files[i];

    document
      .getElementById('status')
      .textContent =
        `Loading ${name}… ${Math.round(
          i / files.length * 100
        )}%`;

    await new Promise(
      (resolve,reject) => {

        const s =
          document.createElement('script');

        s.src = name;

        s.onload = () => {

          document
            .getElementById('status')
            .textContent =
              `Loaded ${name}… ${Math.round(
                (i + 1) / files.length * 100
              )}%`;

          resolve();

        };

        s.onerror = () => {

          reject(
            new Error(
              `Could not load ${name}`
            )
          );

        };

        document.head.appendChild(s);

      }
    );

  }

  movies =
    (window.MOVIE_CHUNKS || []).flat();

  movieByKey =
    new Map(
      movies.map(m => [m.id,m])
    );

  hunt =
    movies.filter(m => {

      const o =
        ownedByKey.get(
          key(m.title,m.year)
        );

      return (
        o &&
        Number(o.rated) === 0 &&
        m.pred != null
      );

    });

  populateGenres();

  document
    .getElementById('status')
    .textContent =
      `${hunt.length} owned, unwatched movies with predictions · ` +
      `${movies.length.toLocaleString()} movies searchable`;

  renderHunt();

}

window.addEventListener(
  'error',
  e => {

    const msg =
      e.message ||
      'Unknown JavaScript error';

    document
      .getElementById('status')
      .textContent =
        'ERROR: ' + msg;

    document
      .getElementById('huntList')
      .innerHTML =
        '<div class="empty">JavaScript error: ' +
        esc(msg) +
        '</div>';

    console.error(e);

  }
);

window.addEventListener(
  'unhandledrejection',
  e => {

    const msg =
      e.reason?.message ||
      String(
        e.reason ||
        'Unknown promise error'
      );

    document
      .getElementById('status')
      .textContent =
        'ERROR: ' + msg;

    document
      .getElementById('huntList')
      .innerHTML =
        '<div class="empty">Loading error: ' +
        esc(msg) +
        '</div>';

    console.error(e);

  }
);

load().catch(e => {

  document
    .getElementById('status')
    .textContent =
      'LOAD ERROR: ' +
      (e.message || e);

  document
    .getElementById('huntList')
    .innerHTML =
      '<div class="empty">' +
      esc(e.message || e) +
      '</div>';

  console.error(e);

});

</script>
